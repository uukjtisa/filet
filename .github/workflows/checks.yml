# The checks that do not need a phone.
#
# The on-device suite (tools/run-gates.sh, 66 tests) is deliberately NOT here: it
# needs real storage, a real launcher and a real package installer, and an
# emulator on a CI runner would turn a meaningful pass into a decorative one.
# GATES.md records where that suite was measured and on what.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push on top of a push makes the older run's answer
# irrelevant, and an Android assemble is several minutes of a shared runner to
# produce it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: R3 — no storage API above the VFS
        run: node tools/check-r3.mjs

      - name: House rules — module graph, app id, icon, theme, licences, docs
        run: |
          node tools/check-modules.mjs
          node tools/check-appid.mjs
          node tools/check-icon.mjs
          node tools/check-theme.mjs
          node tools/check-licences.mjs
          node tools/check-aiuse.mjs
          node tools/check-webui.mjs
          node tools/check-scrollcue.mjs

      # Every checker that can fail without the network must also be able to fail WITH a
      # deliberately broken input, or a passing run proves nothing. These are the selftests.
      - name: Checkers can fail
        run: |
          node tools/check-appid.mjs --selftest
          node tools/check-licences.mjs --selftest
          node tools/check-aiuse.mjs --selftest
          node tools/check-webui.mjs --selftest
          node tools/check-scrollcue.mjs --selftest
          node tools/check-release.mjs --selftest
          node tools/check-releasedoc.mjs --selftest

      # These two ask GitHub, so they are allowed to be the only network-dependent step.
      - name: The published release, and how it is written
        run: |
          node tools/check-release.mjs
          node tools/check-releasedoc.mjs

      - name: JVM unit suites
        run: ./gradlew --no-daemon :core-vfs:test :core-index:test :app:testGithubDebugUnitTest

      - name: Assemble both flavours
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:assembleFdroidDebug
