# The checks that do not need a phone.
#
# The on-device suite (tools/run-gates.sh, 66 tests) is deliberately NOT here: it
# needs real storage, a real launcher and a real package installer, and an
# emulator on a CI runner would turn a meaningful pass into a decorative one.
# GATES.md records where that suite was measured and on what.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push on top of a push makes the older run's answer
# irrelevant, and an Android assemble is several minutes of a shared runner to
# produce it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Every checker in tools/, plus every checker's own selftest.
      #
      # Deliberately NOT an enumerated list. This step used to name eight checkers and seven
      # selftests by hand, and it went stale exactly as you would expect: six checkers were
      # added over two rounds and none of them ran here, so a green tick covered rules nobody
      # was enforcing. The runner discovers tools/check-*.mjs, so a new checker is covered by
      # existing rather than by somebody remembering this file.
      #
      # It also treats exit code 2 as a SKIP with the reason printed, not as a pass and not as
      # a failure. Two of these read the live GitHub release, and GitHub serves an HTML error
      # page under rate limiting often enough to matter; a red build for network weather is a
      # build people learn to ignore.
      - name: Every checker, and every checker's selftest
        run: node tools/check-all.mjs

      - name: JVM unit suites
        run: ./gradlew --no-daemon :core-vfs:test :core-index:test :app:testGithubDebugUnitTest

      - name: Assemble both flavours
        # This now builds the NDK module too - libarchive's RAR readers. The runner has the
        # NDK, and a green build here is what proves the vendored C tree still compiles for
        # all four ABIs after any change to it.
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:assembleFdroidDebug
