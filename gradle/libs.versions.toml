[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# Compose Multiplatform, which is a different thing from the Android BOM above: it supplies the
# desktop widget set and the `jpackage` wiring. Kept at the release that pairs with Kotlin 2.2.
composeMultiplatform = "1.9.0"
coroutines = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# The platform-free coroutines artifact, for the two modules that are plain JVM. The `-android`
# one above pulls in a Main dispatcher backed by a `Looper`, which does not exist off a device -
# so a module shared with a desktop build has to take `-core` and let each consumer bring its own
# Main. `-android` already depends on `-core`, so nothing is duplicated on the Android side.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Swing's event thread as a coroutine dispatcher. Compose Desktop renders on it, so this is the
# desktop module's answer to the `Main` dispatcher `-android` would have provided.
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }

zxing = { group = "com.google.zxing", name = "core", version = "3.5.3" }

libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version = "6.0.0" }
libsu-io = { group = "com.github.topjohnwu.libsu", name = "io", version = "6.0.0" }
smbj = { group = "com.hierynomus", name = "smbj", version = "0.14.0" }
sshj = { group = "com.hierynomus", name = "sshj", version = "0.40.0" }
commons-net = { group = "commons-net", name = "commons-net", version = "3.11.1" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version = "2.0.16" }

smali-dexlib2 = { group = "com.android.tools.smali", name = "smali-dexlib2", version = "3.0.10" }
smali-baksmali = { group = "com.android.tools.smali", name = "smali-baksmali", version = "3.0.10" }
smali-assembler = { group = "com.android.tools.smali", name = "smali", version = "3.0.10" }
apksig = { group = "com.android.tools.build", name = "apksig", version = "9.4.0" }
arsclib = { group = "io.github.reandroid", name = "ARSCLib", version = "1.3.5" }

luaj = { group = "org.luaj", name = "luaj-jse", version = "3.0.1" }

# Archive formats beyond zip: tar, 7z, and the gz/bz2/xz stream wrappers. Apache-2.0, which a
# GPL-3 app may link. Pure Java, no NDK, no ABI splits.
commons-compress = { group = "org.apache.commons", name = "commons-compress", version = "1.27.1" }
# XZ and LZMA2, which commons-compress delegates to for .xz and for most 7z archives. Public
# domain. Without it a .7z reads as unsupported rather than as broken, but most are LZMA2.
xz = { group = "org.tukaani", name = "xz", version = "1.10" }
# Round 9: a zip writer that can actually encrypt. `java.util.zip` has no password support at
# all, and the zip format's own AES extension is what every other tool reads. Apache-2.0, pure
# Java, no NDK. Also the only sane way to write zip's multi-volume layout.
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version = "2.11.5" }

# `org.json` is a STUB inside android.jar: every method throws "not mocked" in a JVM unit
# test. The real implementation on the test classpath is what lets the persistence code be
# tested at all, and persistence is where a silent upgrade bug lives.
jsonTest = { group = "org.json", name = "json", version = "20250517" }
# The same artifact, aliased separately because off Android it is not a test stand-in but the
# real implementation. `android.jar` carries `org.json` on the platform, so :core-dav takes it
# `compileOnly` and the desktop module takes it for real - that way the shared module compiles
# against one API and neither consumer ends up with two copies of it.
json = { group = "org.json", name = "json", version = "20250517" }

# mDNS for the desktop host, advertising the same `_filet-dav._tcp.` service the phone does.
# Android has `NsdManager` and a desktop has nothing, so the one platform without a service
# discovery API is the one that needs a library. Apache-2.0, pure Java.
jmdns = { group = "org.jmdns", name = "jmdns", version = "3.6.3" }
# Mounting is a native call on every OS - `WNetAddConnection2`, `mount.davfs`,
# `NetFSMountURLSync` - and the spec's reason for using the API rather than shelling out to
# `net use` is that an API returns an error code where a subprocess returns localised text.
# From the JVM that means JNA. Dual Apache-2.0 / LGPL-2.1, and the Apache option is what GPL-3
# links. `jna-platform` already maps the Win32 side, so none of it is hand-written.
jna = { group = "net.java.dev.jna", name = "jna", version = "5.19.1" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version = "5.19.1" }

sora-editor = { group = "io.github.Rosemoe.sora-editor", name = "editor", version = "0.23.6" }

androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version = "2.10.1" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }

requery-sqlite = { group = "com.github.requery", name = "sqlite-android", version = "3.49.0" }

androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Plain Kotlin on the JVM, for the modules that are shared with the desktop build and therefore
# cannot be Android libraries. Pinned to the same Kotlin version as everything else.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose Multiplatform: the desktop widgets, and `jpackage` wrapped as a Gradle task. The
# compose COMPILER comes from `kotlin-compose` above - with Kotlin 2.x the two are separate
# plugins, and this one only brings the dependencies and the packaging.
compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }

